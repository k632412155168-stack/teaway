# Cấu hình deploy lên Render (render.com) – đọc tự động khi tạo Blueprint từ repo GitHub
services:
  - type: web
    name: teaway
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
